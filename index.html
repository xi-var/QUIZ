<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퀴즈노트</title>
<meta name="description" content="글이나 사진·PDF를 넣으면 빈칸, OX, 단답 문제를 만들고 틀린 문제를 오답노트에 모아 주는 학습 앱">
<meta name="theme-color" content="#2b4fd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 class="brand">퀴즈노트</h1>
      <p class="tag">자료를 읽고, 문제로 바꿔요</p>
    </div>
    <nav class="nav" aria-label="화면 이동">
      <button type="button" data-view="make">만들기</button>
      <button type="button" data-view="solve">풀기</button>
      <button type="button" data-view="notes">오답노트<span class="badge" id="noteBadge" hidden>0</span></button>
    </nav>
  </header>

  <main>
    <section class="view" id="view-make">
      <div class="sec">
        <h2 class="sec-h"><span class="step">1</span>자료 읽기</h2>
        <textarea id="src" aria-label="학습 자료" spellcheck="false"></textarea>
        <div class="row between">
          <div class="row">
            <label class="file-label">
              <input type="file" id="file" accept="image/*,.pdf,.txt,.md,text/plain" multiple>
              <span class="btn">파일 고르기</span>
            </label>
            <button type="button" class="btn" id="btnExample">예시 글</button>
            <button type="button" class="btn" id="btnClear">비우기</button>
          </div>
          <span class="hint" id="count">0자</span>
        </div>
        <p class="hint" id="ocrHint">사진·스캔 PDF·텍스트 PDF·.txt를 넣을 수 있어요. 사진은 이 기기에서 글자를 읽어요. 처음 한 번은 한글 인식 데이터(수 MB)를 내려받아서 인터넷이 필요해요. 읽은 글은 틀린 글자가 있을 수 있으니 위 칸에서 고쳐 주세요.</p>
        <p class="status" id="readStatus" role="status" aria-live="polite"></p>
        <div class="row" id="stopRow" hidden><button type="button" class="btn small" id="btnStopRead">멈추기</button></div>
      </div>

      <div class="sec">
        <h2 class="sec-h"><span class="step">2</span>문제 설정</h2>
        <div class="opts">
          <div class="field">
            <span class="lbl">문제 수</span>
            <div class="seg" role="radiogroup" aria-label="문제 수">
              <label><input type="radio" name="n" value="5"><span>5문제</span></label>
              <label><input type="radio" name="n" value="10" checked><span>10문제</span></label>
              <label><input type="radio" name="n" value="15"><span>15문제</span></label>
            </div>
          </div>
          <div class="field">
            <span class="lbl">유형</span>
            <div class="seg">
              <label><input type="checkbox" name="t" value="mc" checked><span>빈칸 객관식</span></label>
              <label><input type="checkbox" name="t" value="ox" checked><span>OX</span></label>
              <label><input type="checkbox" name="t" value="short" checked><span>단답</span></label>
            </div>
          </div>
          <p class="hint">글 속 핵심어와 문장을 이 기기 안에서 골라 문제를 만들어요. 자료는 밖으로 나가지 않아요.</p>
        </div>
        <div class="row">
          <button type="button" class="btn primary" id="btnMake">문제 만들기</button>
        </div>
        <p class="status" id="genStatus" role="status" aria-live="polite"></p>
      </div>

      <div class="sec" id="understandSec" hidden>
        <h2 class="sec-h"><span class="step">3</span>이해한 내용</h2>
        <div class="understand" id="understand"></div>
        <div class="row"><button type="button" class="btn primary" id="btnStart">풀어보기</button></div>
      </div>
    </section>

    <section class="view" id="view-solve" hidden>
      <div id="solveBody"></div>
    </section>

    <section class="view" id="view-notes" hidden>
      <div id="notesBody"></div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
